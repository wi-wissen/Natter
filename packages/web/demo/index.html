<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Natter Web Demo</title>
<style>
  :root { --bg: #ffffff; --bg-soft: #f9fafb; --line: #e5e7eb; --text: #111827; --text-3: #6b7280; --primary: #1d4ed8; --canvas: #f1f2f5;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0c0f; --bg-soft: #16181d; --line: #2a2e36; --text: #f3f4f6; --text-3: #9ca3af; --primary: #2563eb; --canvas: #0f1115; }
    .editor { --hl-kw: #c4b5fd; --hl-str: #6ee7b7; --hl-com: #9ca3af; --hl-num: #fcd34d; --hl-bi: #93c5fd; --hl-def: #67e8f9; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 650; white-space: nowrap; }
  select, button { font: 600 14px var(--font); height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); padding: 0 12px; }
  select { font-weight: 500; max-width: 100%; min-width: 0; flex: 0 1 230px; }
  #run { background: var(--primary); border-color: var(--primary); color: #fff; }
  #stop:disabled, #run:disabled { opacity: .5; }
  #status { color: var(--text-3); font-size: 13px; margin-left: auto; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 12px 16px 16px; }
  .editor { position: relative; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-soft); overflow: hidden;
    --hl-kw: #7c3aed; --hl-str: #047857; --hl-com: #6b7280; --hl-num: #b45309; --hl-bi: #1d4ed8; --hl-def: #0e7490; }
  #code, #hl { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 12px; border: 0; font: 14px/1.55 var(--mono);
    letter-spacing: 0; tab-size: 4; white-space: pre; overflow-wrap: normal; }
  #hl { overflow: hidden; color: var(--text); pointer-events: none; }
  #code { resize: none; overflow: auto; background: transparent; color: transparent; caret-color: var(--text); -webkit-text-fill-color: transparent; }
  #code::selection { background: rgba(37, 99, 235, .22); }
  #code:focus { outline: 2px solid var(--primary); outline-offset: -2px; border-radius: 8px; }
  .hl-kw { color: var(--hl-kw); } .hl-str { color: var(--hl-str); } .hl-com { color: var(--hl-com); } .hl-num { color: var(--hl-num); }
  .hl-bi { color: var(--hl-bi); } .hl-def { color: var(--hl-def); }
  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  #stage { flex: 1 1 0; min-height: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--canvas); position: relative; }
  #stage[hidden] { display: none; }
  #stage > div { position: absolute; inset: 8px; }
  #stage > div[hidden] { display: none; }
  #stage > #forms, #stage > #plot { inset: 0; }
  /* the console takes as much room as its output needs (up to 40 %), the stage gets the rest; alone it fills the column */
  #console { flex: 0 1 auto; min-height: 76px; max-height: 40%; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  #stage[hidden] + #console { flex: 1 1 0; max-height: none; }
  #console > .nw-console { flex: 1; border-radius: 0; }
  #console .nw-out:empty::before { content: "Ausgabe erscheint hier"; color: var(--text-3); font-family: var(--font); font-style: italic; }
  #console .nw-scroll:has(.nw-error:not([hidden]), .nw-inrow:not([hidden])) .nw-out:empty::before { content: none; }
  @media (max-width: 760px) {
    body { height: auto; min-height: 100%; }
    header { padding: 8px 12px; }
    header h1 { width: 100%; }
    select { flex: 1 1 100%; }
    #status { margin-left: 0; }
    main { display: flex; flex-direction: column; padding: 8px 12px 16px; }
    .editor { flex: none; height: 38vh; }
    #stage { flex: none; height: min(92vw, 60vh); }
    #stage.tall { height: 72vh; }
    /* Kara: as high as the world needs at full width (inner box inset 8 px), no grey bands */
    #stage.fit { height: min(92vw, 60vh, calc((100vw - 40px) * var(--world-ratio) + 16px)); }
    #console { flex: none; min-height: 64px; max-height: 45vh; }
    #stage[hidden] + #console { flex: none; min-height: 32vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Natter im Browser</h1>
  <select id="examples" aria-label="Beispiel"></select>
  <button id="run" type="button">▶ Start</button>
  <button id="stop" type="button" disabled>■ Stopp</button>
  <span id="status">bereit</span>
</header>
<main>
  <div class="editor"><pre id="hl" aria-hidden="true"></pre><textarea id="code" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Programm"></textarea></div>
  <div class="side">
    <div id="stage" hidden><div id="turtle" hidden></div><div id="kara" hidden></div><div id="forms" hidden></div><div id="plot" hidden></div><div id="pgzero" hidden></div></div>
    <div id="console"></div>
  </div>
</main>
<script type="module" src="./demo.js"></script>
</body>
</html>
